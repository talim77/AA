<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Side Menu Project</title>
    <link rel="stylesheet" href="SidebarMenu.css">
    <script src="https://kit.fontawesome.com/d61117123c.js" crossorigin="anonymous"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>
<body>
    
    
    <div class="main-box">
        <input type="checkbox" id="check">
        <div class="btn1">
            <label for="check">
                <i class="fa-solid fa-bars"></i>
            </label>
        </div>


        <!------------ Menu ke sade me logo ---------->


        <div class="sidebar-menu">
            <div class="logo">
                <a href="#">Talim Brand</a>
            </div>
            

            <div class="btn2">
                <label for="check">
                    <i class="fa-solid fa-xmark"></i>
                </label>
            </div>


            <!-------------- Sides ke menu hain --------------->


            <div class="menu">
                <ul>
                    <li class="li1" style="transition: all 0.5s 0.25s;">
                        <i class="fa-solid fa-image"></i>
                        <a href="#">Gallery</a>
                    </li>
                    <li class="li2" style="transition: all 0.5s 0.5s;">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        <a href="#">Shortcuts</a>
                    </li>
                    <li class="li3" style="transition: all 0.5s 0.75s;">
                        <i class="fa-solid fa-photo-film"></i>
                        <a href="#">Exhibits</a>
                    </li>
                    <li class="li4" style="transition: all 0.5s 1s;">
                        <i class="fa-solid fa-calendar-days"></i>
                        <a href="#">Events</a>
                    </li>
                    <li class="li5" style="transition: all 0.5s 1.25s;">
                        <i class="fa-solid fa-store"></i>
                        <a href="#">Store</a>
                    </li>
                    <li class="li6" style="transition: all 0.5s 1.5s;">
                        <i class="fa-solid fa-phone"></i>
                        <a href="#">Contact</a>
                    </li>
                    <li class="li7" style="transition: all 0.5s 1.75s;">
                        <i class="fa-solid fa-comments"></i>
                        <a href="#">Feedback</a>
                    </li>
                </ul>
            </div>


            <!----------- sabse niche wala social media icons ---------->


            <div class="social-media">
                <ul>
                    <a href="#">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a href="#">
                        <i class="fa-brands fa-facebook"></i>
                    </a>
                    <a href="#">
                        <i class="fa-brands fa-youtube"></i>
                    </a>
                    <a href="#">
                        <i class="fa-brands fa-whatsapp"></i>
                    </a>
                </ul>
            </div>
        </div>
    </div>
    
    


</body>
</html>
