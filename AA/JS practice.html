<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StopWatch</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        font-family: sans-serif;
        box-sizing: border-box;
    }
    
    body{
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: gray;
    }

    .container{
        width: 100%;
        max-width: 425px;
        padding: 0rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    
    .flex{
        width: 100%;
        display: flex;
        justify-content: center;
        column-gap: 0.5rem;
    }
    .flex-col{
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        row-gap: 1.5rem;
    }

    button {
        padding: 0.5rem 1rem;
        background-color: black;
        color: white;
        font-size: 20px;
        font-weight: 600;
        border-radius: 5px;
        border: none;
    }


    #box-of-pass{
        font-size: 18px;
        color: black;
        padding: 4px 8px;
        border: 2px solid blue;
        border-radius: 5px;
        width: 400px;
    }


    .slider{
        display: flex;
        justify-content: start;
        align-items: center;
        max-width: 600px;
        min-width: 500px;
        min-height: 250px;
        max-height: 600px;
        box-sizing: content-box;
        overflow: hidden;
        position: relative;
        border: 2px solid red;
    }

    #slider-img{
        max-width: 500px;
        min-width: 500px;
        position: absolute;
        transition: all 0.5s;
    }
    .dots{
        display: flex;
        justify-content: center;
        width: 100%;
        
        position: absolute;
        left: 0;
        bottom: 0;
        gap: 0.25rem;
        border: 2px solid red;
    }
    #dot{
        transition: all 0.5s ease;
        height: 30px;
        max-width: 20px !important;
        border-radius: 50%;
    }
    .inactive1{
        background-color: black;
    }
    .active{
        background-color: darkred;
    }



    .box-input{
        border: 2px solid red;
        padding: 0.5rem;
        margin: 0.5rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    input{
        height: 40px;
        width: 400px;
        /* border: 2px solid red; */
    }
</style>
<body>
    <div class="container">

        <div class="flex-col">
            <h1>StopWatch</h1>
            <h1 class="flex">
                <div class="flex">
                    <p class="hours">00</p>
                    <p>:</p>
                </div>
                <div class="flex">
                    <p class="minutes">00</p>
                    <p>:</p>
                </div>
                <div class="flex">

                    <p class="seconds">00</p>
                </div>
            </h1>
        </div>
        <div class="flex">
            <button class="Stop">Stop</button>
            <button class="Start">Start</button>
            <button class="Reset">Reset</button>
        </div>
        <div class="flex" style="margin: 1rem 0rem;">
            <button class="Lap">Lap</button>
        </div>
        <!-- <div class="flex sbt">
            <h3>Laps</h3>
            <h3>Time</h3>
            <h3>Total</h3>
        </div> -->
        <div class="flex-col">
            <ol class="flex-col adde">
            </ol>
        </div>
    </div>

    <div class="constainer">
        <h1>Password Generator</h1>
        <input id="box-of-pass" type="search" placeholder="Please enter a valid number between 4 to 16">
        <h2 id="pass" style="color: gray;">a</h2>
        <button id="generate">Generate Password</button>
    </div>

    <div class="slider">
        <img id="slider-img" src="https://picsum.photos/id/255/1000/500" alt="">
        <img id="slider-img" src="https://picsum.photos/id/277/1000/500" alt="">
        <img id="slider-img" src="https://picsum.photos/id/288/1000/500" alt="">
        <img id="slider-img" src="https://picsum.photos/id/289/1000/500" alt="">
        <img id="slider-img" src="https://picsum.photos/id/100/1000/500" alt="">
        <img id="slider-img" src="https://picsum.photos/id/244/1000/500" alt="">
        
        <div class="dots">
            <button id="dot" class="inactive active"></button>
            <button id="dot" class="inactive"></button>
            <button id="dot" class="inactive"></button>
            <button id="dot" class="inactive"></button>
            <button id="dot" class="inactive"></button>
            <button id="dot" class="inactive"></button>
        </div>
    </div>
    
    
    <div class="container flex">
        <button id="next">Next</button>
        <button id="previews">Previews</button>
    </div>


    <div class="container">
        <div class="box-input">
            <input id="Input-number" type="number" placeholder="Enter the number">
            <input id="output-roman" type="text" placeholder="Roman">
        </div>
        <div class="box">
            <button id="convert">convert to Roman</button>
        </div>
    </div>


<script>
    // selecting timer elements
    let hours = document.querySelector(".hours");
    let minutes = document.querySelector(".minutes");
    let seconds = document.querySelector(".seconds");
    // selecting buttons elements
    let Stop = document.querySelector(".Stop");
    let Start = document.querySelector(".Start");
    let Reset = document.querySelector(".Reset");
    // this is for Lap creation
    let lap = document.querySelector(".Lap");
    let addelmnt = document.querySelector(".adde"); //for adding element in "Lap"


    //this is for Lap
    let Scounter = 0;
    let Mcounter = 0;
    let Hcounter = 0;

    lap.addEventListener("click", crtElement); // for Lap 
    Start.addEventListener("click", timerStart); // for start/resume
    Stop.addEventListener("click", function() { //for stop/pause
        clearInterval(Timer);
    });
    Reset.addEventListener("click", function(){ // fro reset
        clearInterval(Timer);
        reset ();
    });

    // increasing timing for check all logics and conditions in less time 
    // (real 1sec = 5sec in my stopwatch) also minutes and hours
    function timerStart() {
        Timer = setInterval(stopWatch, 200)
    };

    function reset (){
        seconds.textContent = "00";
        minutes.textContent = "00";
        hours.textContent = "00";

        while (addelmnt.firstChild) {
            li.textContent = '';
            addelmnt.removeChild(addelmnt.firstChild)
        }
    };

    function crtElement() {
        let li = document.createElement("li");
        li.textContent = (`Lap: ${Hcounter}h ${Mcounter}m ${Scounter}s`);
        addelmnt.appendChild(li);
    }

    function stopWatch () {
        seconds.textContent++;
        Scounter++;
        if (seconds.textContent == 5) { // decreasing minutes value (5sec = 1min)
            seconds.textContent = 0;
            minutes.textContent++;
            Mcounter++;
            Scounter = 0;
            if (minutes.textContent == 5) { // decreasing hours value (5min = 1hour)
                hours.textContent++;
                Hcounter++;
                Mcounter = 0
                minutes.textContent = 0;
            }   
        }
    }

</script>


<script src="app.js"></script>

</body>
</html>
